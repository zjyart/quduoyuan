name: 问题反馈
description: 报告安装、地图、费用计算或使用问题
body:
  - type: markdown
    attributes:
      value: |
        能访问仓库的人可以看到你提交的问题。请勿填写真实住址、精确坐标、地图凭证或未脱敏的行程。
        涉及安全和个人隐私，请查看仓库的 Security 指引。
  - type: input
    id: environment
    attributes:
      label: 平台、App 版本与系统版本
      placeholder: 例如 Mac、App 版本、macOS 版本；或 iPhone、TestFlight 构建号、iOS 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      description: 尽量用公开地点或虚构数据，按顺序描述你的操作。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 脱敏后的提示或截图（可选）
      description: 安装问题可附附件名称；地图问题可补充连接状态。
